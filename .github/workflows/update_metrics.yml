name: Scheduled Metrics Data Tracker

on:
  workflow_dispatch:      # Allows you to click a button and trigger updates manually

permissions:
  contents: write         # Explicitly grants the workflow runner rights to push updates back into repo

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    
    # FIX: Force runner to use Node.js 24 for all steps, completely removing the deprecation warnings
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0    # Fetches full history to ensure seamless branch tracking alignments

    - name: Set up Python Instance
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Scraping Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Aggregator Script
      run: python worker.py

    - name: Commit and Push Updated Snapshot Data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # 1. Safeguard our newly scraped data file completely outside the git workspace tree
        if [ -f metrics.json ]; then
          cp metrics.json /tmp/metrics.json
        else
          echo "metrics.json not found, skipping sync operations."
          exit 0
        fi
        
        # 2. Force fetch the server's history and reset our local branch pointer perfectly to origin/main
        # This completely resolves any out-of-sync tracking or detached HEAD rejections
        git fetch origin main
        git checkout -B main origin/main
        
        # 3. Bring our freshly generated metrics data back into the fully synchronized workspace
        cp /tmp/metrics.json metrics.json
        
        # 4. Stage, check for changes, commit, and push upstream atomically
        git add metrics.json
        if ! git diff-index --quiet HEAD; then
          git commit -m "Automated metrics snapshot update [skip ci]"
          git push origin main
        else
          echo "No numerical changes detected in metrics parameters. Skipping push routine."
        fi
