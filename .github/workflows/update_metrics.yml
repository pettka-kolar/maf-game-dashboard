name: Scheduled Metrics Data Tracker

on:
  schedule:
    - cron: '0 * * * *'  # Automatically runs every single hour on the hour
  workflow_dispatch:      # Allows you to click a button and trigger updates manually

permissions:
  contents: write         # Explicitly grants the workflow runner rights to push updates back into repo

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0    # Fetches full history to ensure seamless branch tracking alignments

    - name: Set up Python Instance
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Scraping Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Aggregator Script
      run: python worker.py

    - name: Commit and Push Updated Snapshot Data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git pull metrics.json
        
        # 1. Safeguard our newly scraped data file out of the git tree temporarily
        if [ -f metrics.json ]; then
          cp metrics.json /tmp/metrics.json
        else
          echo "metrics.json not found, skipping sync."
          exit 0
        fi
        
        # 2. Fetch absolute latest changes and force-align local history with GitHub origin
        git fetch origin main
        git checkout main
        git reset --hard origin/main
        
        # 3. Move our freshly generated metrics data back into the perfectly synced workspace
        cp /tmp/metrics.json metrics.json
        
        # 4. Stage, check for changes, commit, and push upstream atomically
        git add metrics.json
        if ! git diff-index --quiet HEAD; then
          git commit -m "Automated metrics snapshot update [skip ci]"
          git push origin main
        else
          echo "No numerical changes detected in metrics parameters. Skipping push routine."
        fi