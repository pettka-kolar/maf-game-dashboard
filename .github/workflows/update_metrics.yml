name: Scheduled Metrics Data Tracker

on:
  schedule:
    - cron: '0 * * * *'  # Automatically runs every single hour on the hour
  workflow_dispatch:      # Allows you to click a button and trigger updates manually

permissions:
  contents: write         # Explicitly grants the workflow runner rights to push updates back into repo

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python Instance
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Scraping Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Aggregator Script
      run: python worker.py

    - name: Commit and Push Updated Snapshot Data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Stage the freshly generated metrics file
        git add metrics.json
        
        # Only proceed if the data has actually changed
        if ! git diff-index --quiet HEAD; then
          git commit -m "Automated metrics snapshot update [skip ci]"
          
          # FIX: Pull any human updates pushed during runtime. 
          # '-X theirs' tells git to favor the bot's freshly generated data if a json layout collision occurs.
          git pull --rebase -X theirs origin main
          
          # Safely push the combined history back upstream
          git push origin main
        fi